<!DOCTYPE html>
<html lang="it" data-theme="kitchen">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d5eaf">
  <title>Pickleball Greece</title>
  <link rel="icon" type="image/png" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Pickleball Greece">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/temi.css">
  <script src="js/temi.js"></script>
  <script>
    // Stile grafico scelto su questo dispositivo (applicato subito, prima del caricamento dell'app).
    try { Temi.apply(Temi.saved() || Temi.DEFAULT); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img class="logo" src="img/logo.png" alt="Pickleball Greece" width="50" height="50">
      <span class="brand-text"><strong id="clubName">Pickleball Greece</strong><small>prenotazioni · tornei · corsi</small></span>
    </a>
    <a class="hdr-badges" id="hdrBadges" href="#/profilo" title="I miei premi" hidden></a>
    <nav class="mainnav" aria-label="Menu principale">
      <a href="#/" data-nav=""><i class="ti ti-home" aria-hidden="true"></i><span>Home</span></a>
      <a href="#/prenota" data-nav="prenota"><i class="ti ti-calendar-plus" aria-hidden="true"></i><span>Prenota</span></a>
      <a href="#/tornei" data-nav="tornei"><i class="ti ti-trophy" aria-hidden="true"></i><span>Tornei</span></a>
      <a href="#/classifiche" data-nav="classifiche"><i class="ti ti-chart-bar" aria-hidden="true"></i><span>Classifiche</span></a>
      <a href="#/corsi" data-nav="corsi"><i class="ti ti-school" aria-hidden="true"></i><span>Corsi</span></a>
      <a href="#/admin" data-nav="admin" data-admin-only hidden><i class="ti ti-settings" aria-hidden="true"></i><span>Admin</span></a>
    </nav>
    <div class="top-actions">
      <button type="button" class="icon-btn" data-action="theme" aria-label="Stile grafico"><i class="ti ti-palette" aria-hidden="true"></i></button>
      <a class="who" id="who" href="#/profilo" aria-label="Profilo"></a>
    </div>
  </header>

  <main id="app" class="container"></main>

  <dialog id="dialog" class="dialog"></dialog>

  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/premi.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/cloud.js"></script>
</body>
</html>
