<!DOCTYPE html>
<html lang="it" data-theme="protour">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Pickleball Tribe</title>
  <link rel="icon" type="image/png" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Pickleball Tribe">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/temi.css">
  <script src="js/i18n.js"></script>
  <script src="js/temi.js"></script>
  <script>
    // Stile grafico scelto su questo dispositivo (applicato subito, prima del caricamento dell'app).
    try { Temi.apply(Temi.saved() || Temi.DEFAULT); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img class="logo" src="img/logo.png" alt="Pickleball Tribe" width="50" height="50">
      <span class="brand-text"><strong id="clubName">Pickleball Tribe</strong><small data-t>sfide · tornei · classifiche</small></span>
    </a>
    <a class="hdr-badges" id="hdrBadges" href="#/profilo" title="I miei premi" hidden></a>
    <nav class="mainnav" aria-label="Menu principale" data-t-aria>
      <a href="#/" data-nav=""><i class="ti ti-home" aria-hidden="true"></i><span data-t>Home</span></a>
      <a href="#/sfide" data-nav="sfide"><i class="ti ti-swords" aria-hidden="true"></i><span data-t>Sfide</span></a>
      <a href="#/leghe" data-nav="leghe"><i class="ti ti-shield" aria-hidden="true"></i><span data-t>Leghe</span></a>
      <a href="#/tornei" data-nav="tornei"><i class="ti ti-trophy" aria-hidden="true"></i><span data-t>Tornei</span></a>
      <a href="#/classifiche" data-nav="classifiche"><i class="ti ti-chart-bar" aria-hidden="true"></i><span data-t>Classifiche</span></a>
      <a href="#/corsi" data-nav="corsi"><i class="ti ti-school" aria-hidden="true"></i><span data-t>Corsi</span></a>
      <a href="#/campo" data-nav="campo" data-scorer-only hidden><i class="ti ti-clipboard-text" aria-hidden="true"></i><span data-t>Le mie gare</span></a>
      <a href="#/admin" data-nav="admin" data-admin-only hidden><i class="ti ti-settings" aria-hidden="true"></i><span data-t>Admin</span></a>
    </nav>
    <div class="top-actions">
      <button type="button" class="icon-btn notif-btn" id="notifBtn" data-action="notifiche" aria-label="Avvisi" data-t-aria hidden><i class="ti ti-bell" aria-hidden="true"></i><span class="notif-count"></span></button>
      <button type="button" class="icon-btn" data-action="lang" aria-label="Lingua" data-t-aria><i class="ti ti-world" aria-hidden="true"></i></button>
      <button type="button" class="icon-btn" data-action="theme" aria-label="Stile grafico" data-t-aria><i class="ti ti-palette" aria-hidden="true"></i></button>
      <a class="who" id="who" href="#/profilo" aria-label="Profilo" data-t-aria></a>
    </div>
  </header>

  <main id="app" class="container"></main>

  <dialog id="dialog" class="dialog"></dialog>

  <script>I18n.page();</script>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/premi.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/score.js"></script>
  <script src="js/referto.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/cloud.js"></script>
  <script>
    // copia dell'app sul telefono (si apre anche senza internet)
    if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(() => {
      // anche il file della lingua in uso
      const l = document.querySelector('script[src^="js/lang/"]');
      if (l && window.caches) caches.open('pbm-app-v1').then(c => c.add(l.getAttribute('src'))).catch(() => {});
    }).catch(() => {}); });
  </script>
</body>
</html>
