# Pubblica automaticamente l'app Pickleball Tribe su Firebase (sito + regole del database)
# a ogni modifica salvata sul ramo main.
# Serve il secret del repository PICKLEBALLGREECE (o FIREBASE_SA_PICKLEBALLGREECE) (Settings → Secrets and variables → Actions):
# chiave JSON dell'account di servizio del progetto pickleballgreece-955da.
name: Pubblica Pickleball Tribe

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pubblica-pickleball-greece
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenziali Firebase
        env:
          SA1: ${{ secrets.FIREBASE_SA_PICKLEBALLGREECE }}
          SA2: ${{ secrets.FIREBASE_SA_PICKLEBALL_GREECE }}
          SA3: ${{ secrets.FIREBASE_SA_PICKLEBALL }}
          SA4: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA5: ${{ secrets.FIREBASE_SA }}
          SA6: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PICKLEBALLGREECE_955DA }}
          SA7: ${{ secrets.PICKLEBALLGREECE }}
        run: |
          # Si accetta il primo segreto presente tra i nomi previsti (nel registro compare solo il nome, mai il contenuto).
          KEY=""; NAME=""
          for n in 7:PICKLEBALLGREECE 1:FIREBASE_SA_PICKLEBALLGREECE 2:FIREBASE_SA_PICKLEBALL_GREECE 3:FIREBASE_SA_PICKLEBALL 4:FIREBASE_SERVICE_ACCOUNT 5:FIREBASE_SA 6:FIREBASE_SERVICE_ACCOUNT_PICKLEBALLGREECE_955DA; do
            v="SA${n%%:*}"
            if [ -n "${!v}" ]; then KEY="${!v}"; NAME="${n#*:}"; break; fi
          done
          if [ -z "$KEY" ]; then
            echo "::error::Nessun segreto con la chiave Firebase trovato in questo repository (nome previsto: FIREBASE_SA_PICKLEBALLGREECE, in Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi
          echo "Chiave Firebase letta dal segreto: $NAME"
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('type')=='service_account'; print('Account di servizio del progetto:', d.get('project_id'))" "$RUNNER_TEMP/firebase-key.json"; then
            echo "::error::Il segreto $NAME non contiene il file JSON della chiave dell'account di servizio (va incollato tutto il contenuto del file .json)."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"
      - name: Secondo indirizzo pickleballtribe.web.app
        continue-on-error: true
        run: |
          FB="npx --yes firebase-tools@13 --project pickleballgreece-955da --non-interactive"
          if $FB hosting:sites:get pickleballtribe >/dev/null 2>&1 || $FB hosting:sites:create pickleballtribe; then
            echo "Sito pickleballtribe pronto."
            # stessa configurazione del sito principale, pubblicata su entrambi gli indirizzi
            python3 - <<'PY'
          import json
          c = json.load(open('firebase.json'))
          h = c['hosting']
          c['hosting'] = [dict(h, site='pickleballgreece-955da'), dict(h, site='pickleballtribe')]
          json.dump(c, open('firebase.json', 'w'), indent=2)
          PY
          else
            echo "::warning::Non sono riuscito a creare il sito pickleballtribe (nome già preso o permessi mancanti)."
          fi
      - name: Pubblicazione (sito e regole del database)
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project pickleballgreece-955da --non-interactive
      - name: Pulizia
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
